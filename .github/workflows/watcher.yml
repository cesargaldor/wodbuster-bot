name: 👁️ Watcher — Verificación de cookie

# ─── Zona horaria ─────────────────────────────────────────────────────────────
# Se dispara a las 15:00 UTC y 16:00 UTC cada día.
# Un paso inicial comprueba si la hora en Madrid es 17:00 y descarta la
# ejecución duplicada automáticamente, sin necesidad de ajuste manual por DST:
#
#   · Verano  (CEST, UTC+2): 15:00 UTC = 17:00 CEST ✅ | 16:00 UTC = 18:00 ❌ (descartado)
#   · Invierno (CET,  UTC+1): 15:00 UTC = 16:00 CET ❌ (descartado) | 16:00 UTC = 17:00 ✅
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 15 * * *" # 17:00 CEST (verano, UTC+2)
    - cron: "0 16 * * *" # 17:00 CET  (invierno, UTC+1)
  workflow_dispatch: # Permite lanzarlo manualmente desde la pestaña Actions

jobs:
  watcher:
    name: Verificar sesión Wodbuster
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🕐 Verificar hora (solo ejecutar a las 17:00 Madrid)
        id: check_time
        run: |
          MADRID_HOUR=$(TZ='Europe/Madrid' date +%H)
          echo "Hora actual en Madrid: ${MADRID_HOUR}:00"

          if [ "$MADRID_HOUR" = "17" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "✅ Son las 17:00 Madrid, ejecutando chequeo..."
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No son las 17:00 Madrid (son las ${MADRID_HOUR}:00). Ignorando ejecución duplicada."
          fi

      - name: 📥 Checkout
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: 📦 Instalar pnpm
        if: steps.check_time.outputs.should_run == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 🟢 Setup Node.js
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: 📚 Instalar dependencias
        if: steps.check_time.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile

      - name: 🍪 Obtener cookie desde Cloudflare KV
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          COOKIE=$(curl -sf \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_NAMESPACE_ID }}/values/session_cookie" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}")

          if [ -z "$COOKIE" ]; then
            echo "❌ No se pudo obtener la cookie desde Cloudflare KV"
            exit 1
          fi

          echo "$COOKIE" > cookie.txt
          echo "✅ Cookie obtenida correctamente"

      - name: 🔍 Verificar sesión
        if: steps.check_time.outputs.should_run == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: pnpm tsx watcher.ts
