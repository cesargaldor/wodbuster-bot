name: 🏋️ Booking — Reserva de clase

# ─── Zona horaria y Retrasos de GitHub ───────────────────────────────────────
# GitHub Actions puede retrasar la ejecución de crons varios minutos.
# Este workflow se dispara a las 19:55 UTC y 20:55 UTC.
#
# La lógica de comprobación ahora permite un margen de error:
# Se acepta la ejecución si en Madrid son las 21:xx O si son las 22:00-22:15.
# Esto evita que el retraso de GitHub mate el proceso antes de empezar.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "45 19 * * *" # 21:55 CEST (verano, UTC+2)
    - cron: "45 20 * * *" # 21:55 CET  (invierno, UTC+1)
  workflow_dispatch: # Permite lanzarlo manualmente

jobs:
  booking:
    name: Reservar clase CrossFit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 🕐 Verificar hora (con margen para retrasos de GitHub)
        id: check_time
        run: |
          # Extraemos hora y minuto en Madrid
          MADRID_HOUR=$(TZ='Europe/Madrid' date +%H)
          MADRID_MINUTE=$(TZ='Europe/Madrid' date +%M)
          echo "Hora actual en Madrid: ${MADRID_HOUR}:${MADRID_MINUTE}"

          # LÓGICA:
          # Aceptamos si son las 21:xx (llegada puntual o temprana)
          # O si son las 22:xx pero antes de las 22:15 (llegada con retraso de GitHub)
          if [ "$MADRID_HOUR" = "21" ] || ([ "$MADRID_HOUR" = "22" ] && [ "$MADRID_MINUTE" -lt 15 ]); then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "✅ Ventana válida detectada. Iniciando proceso..."
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Fuera de ventana horaria. Ignorando para evitar duplicados."
          fi

      - name: 📥 Checkout
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: 📦 Instalar pnpm
        if: steps.check_time.outputs.should_run == 'true'
        uses: pnpm/action-setup@v4

      - name: 🟢 Setup Node.js
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: 📚 Instalar dependencias
        if: steps.check_time.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile

      - name: 🍪 Obtener cookie desde Cloudflare KV
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          COOKIE=$(curl -sf \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_NAMESPACE_ID }}/values/session_cookie" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}")

          if [ -z "$COOKIE" ]; then
            echo "❌ No se pudo obtener la cookie desde Cloudflare KV"
            exit 1
          fi

          echo "$COOKIE" > cookie.txt
          echo "✅ Cookie obtenida correctamente"

      - name: 📅 Obtener configuración de días desde Cloudflare KV
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          CONFIG=$(curl -sf \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_NAMESPACE_ID }}/values/days_config" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}")

          if [ -z "$CONFIG" ]; then
            echo '{"activeDays":[]}' > days_config.json
            echo "ℹ️ No hay configuración en KV, usando lista vacía"
          else
            echo "$CONFIG" > days_config.json
            echo "✅ Configuración de días obtenida"
          fi

      - name: 🚀 Ejecutar Sniper (Esperará a las 22:00:00 exactas)
        if: steps.check_time.outputs.should_run == 'true'
        env:
          IDU: ${{ secrets.IDU }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          TARGET_HOUR: ${{ secrets.TARGET_HOUR }}
          TARGET_TYPE: ${{ secrets.TARGET_TYPE }}
          TARGET_HOUR_SATURDAY: ${{ secrets.TARGET_HOUR_SATURDAY }}
          TARGET_TYPE_SATURDAY: ${{ secrets.TARGET_TYPE_SATURDAY }}
        run: pnpm tsx index.ts
